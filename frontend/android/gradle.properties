# Memory for the Android build. 8 GB + 4 GB was too much on a 16 GB laptop with other apps open
# ("insufficient memory for the Java Runtime"), so keep it modest.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=3
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The project is on drive E: and the Flutter package cache on C:. Kotlin's incremental cache
# cannot handle two drives ("Could not close incremental caches"), so build without it.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
